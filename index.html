<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For My Kolchuma — London Muslim Family Events</title>
  <meta name="description" content="Curated locally by me." />
  <meta property="og:title" content="For My Kolchuma" />
  <meta property="og:description" content="Curated halal events for Muslim families in East London" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#1A7A6D" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>" />
  <style>
    body{margin:0;background:#FAFAF7}
    #root{min-height:100vh}
    .ld{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Georgia',serif;color:#1C1C1C;background:linear-gradient(145deg,#FAFAF7 0%,#F0EDE5 100%);animation:ldFade 2s ease forwards}
    .ld .moon{font-size:56px;margin-bottom:20px;animation:ldFloat 1.5s ease-in-out infinite}
    .ld h1{font-size:32px;margin-bottom:6px;letter-spacing:-.5px;opacity:0;animation:ldSlide .6s ease .3s forwards}
    .ld p{font-size:14px;color:#999;opacity:0;animation:ldSlide .6s ease .6s forwards}
    .ld .credit{font-size:12px;color:#C48A2D;margin-top:24px;opacity:0;animation:ldSlide .6s ease .9s forwards;font-style:italic}
    @keyframes ldFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(5deg)}}
    @keyframes ldSlide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes ldFade{0%{opacity:1}80%{opacity:1}100%{opacity:0;pointer-events:none}}
  </style>
</head>
<body>
  <div id="root"><div class="ld"><div class="moon">🌙</div><h1>For My Kolchuma</h1><p>Loading events...</p><span class="credit">Made by Ridhwan, with love ♥</span></div></div>

  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
